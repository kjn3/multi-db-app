services:
  library:
    image: postgres:16
    container_name: library_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    ports:
      - "5441:5432"

  school:
    image: postgres:16
    container_name: school_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school
    ports:
      - "5442:5432"

  store_shard_1:
    image: postgres:16
    container_name: store_shard_1
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store
    ports:
      - "5443:5432"

  store_shard_2:
    image: postgres:16
    container_name: store_shard_2
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store
    ports:
      - "5444:5432"
